<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="mfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="mfShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0a1840" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="128" height="128" rx="28" fill="url(#mfBg)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Brand Glyph: Interlocking M + Fetch Arrow -->
  <g filter="url(#mfShadow)" fill="#FFFFFF">
    <!-- Left Pillar of M -->
    <rect x="26" y="34" width="16" height="46" rx="8"/>
    
    <!-- Right Pillar of M -->
    <rect x="86" y="34" width="16" height="46" rx="8"/>
    
    <!-- Central Fetch Arrow -->
    <path d="M 58 32 C 58 29.8 59.8 28 62 28 H 66 C 68.2 28 70 29.8 70 32 V 64 H 58 Z"/>
    <path d="M 45 61 C 43.2 61 42.3 63.2 43.6 64.6 L 62.6 84.4 C 63.4 85.2 64.6 85.2 65.4 84.4 L 84.4 64.6 C 85.7 63.2 84.8 61 83 61 Z"/>

    <!-- Bottom Data Platform -->
    <rect x="26" y="94" width="76" height="10" rx="5" fill-opacity="0.95"/>
  </g>
</svg>
